name: proyecto-biblioteca
services:
  webapp:
    build: .
    container_name: biblioteca-web
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - app-network

  mongo:
    image: mongo:7
    container_name: biblioteca-mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb-volume:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  mongodb-volume:
